name: Deploy Comic Threads web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "comic-threads/**"
      - ".github/workflows/deploy-comic-threads-web.yml"
  # Lets you run this by hand from the Actions tab against any branch — useful
  # before this work has been merged to main, where the push trigger above
  # won't fire yet.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comic-threads
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: comic-threads/package-lock.json

      - run: npm install

      # @comic-threads/web depends on the *built* output of these two
      # packages (their package.json "main" points at dist/index.js), not
      # their TypeScript source, so they have to be built first.
      - run: npm run build --workspace @comic-threads/core
      - run: npm run build --workspace @comic-threads/github-source

      # GitHub Pages serves a project site from /<repo>/, not /, so the app
      # needs to know its own base path (packages/web/vite.config.ts reads
      # this from COMIC_THREADS_BASE; the router is hash-based, so no
      # server-side rewrite rule is needed for deep links to work here).
      - run: npm run build --workspace @comic-threads/web
        env:
          COMIC_THREADS_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: comic-threads/packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
